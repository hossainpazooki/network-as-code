# Violation: SEC-002 - demo target for `./run.sh demo`. Egress ipBlock
# 10.0.0.0/8 is 256x broader than the declared VPC CIDR 10.0.0.0/16, and
# carries no exemption annotation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-wide-demo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 6379
