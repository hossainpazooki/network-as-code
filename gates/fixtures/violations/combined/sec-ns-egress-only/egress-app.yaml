# Second Egress-only policy in the set, and still no Ingress-type policy
# anywhere - SEC-003 must fire exactly once for the set, not once per file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: temporal-dev
      ports:
        - protocol: TCP
          port: 7233
